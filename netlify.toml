[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

  [[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https://js.stripe.com https://m.stripe.network; script-src 'self' 'unsafe-inline' https://js.stripe.com https://m.stripe.network; connect-src 'self' https://api.stripe.com https://m.stripe.network; frame-src https://js.stripe.com https://hooks.stripe.com https://m.stripe.network;"

