<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order – The Memory House</title>
  <link rel="stylesheet" href="/assets/fonts/memho-fonts.css?v=1">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: 'CormorantGaramond', serif;
      background: #fdfbf7;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 720px;
      margin: 40px auto;
      background: white;
      padding: 40px 30px;
      border-radius: 10px;
    }
    form {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 15px;
      text-align: left;
    }
    label {
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      align-self: center;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #b88a44;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #card-element {
      border: 1px solid #ccc;
      padding: 12px;
      border-radius: 6px;
      width: 100%;
      background: white;
      margin-top: 10px;
      min-height: 56px;
    }
    #card-errors {
      color: red;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Order Your Portrait</h1>
    <form id="payment-form">
      <label for="name">Your Name:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="address">Mailing Address:</label>
      <textarea id="address" name="address" rows="3" required></textarea>

      <label for="size">Portrait Size:</label>
      <select id="size" name="size" required>
        <option value="Premium Gift Package">Premium Gift Package (Best Value)</option>
        <option value="18×24">18×24</option>
        <option value="12×18">12×18</option>
        <option value="8×10">8×10</option>
      </select>

      <label for="notes">Special Notes or Requests:</label>
      <textarea id="notes" name="notes" rows="4" placeholder="e.g., remove tree, include pet, change season, etc."></textarea>

      <div id="card-element"></div>
      <div id="card-errors" role="alert"></div>

      <button type="submit">Submit Order</button>
    </form>
  </div>

  <script src="https://js.stripe.com/v3/"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const stripe = Stripe("pk_live_51Ric5sAyeIzuGSz82jAzY5GAGschIxgwdRuf5vWHpL5sLYv3c5jIlTIOgpjNgkNMIAf40eSJKATw7J2MfknvqD6G00shdDdHnZ");

      const elements = stripe.elements();
      const card = elements.create("card");
      card.mount("#card-element");

      const priceMap = {
        "Premium Gift Package": 44000,
        "18×24": 39000,
        "12×18": 29000,
        "8×10": 19000
      };

      const form = document.getElementById("payment-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const size = document.getElementById("size").value;
        const amount = priceMap[size];

        const res = await fetch("/.netlify/functions/create-payment-intent", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ amount })
        });

        const data = await res.json();
        if (!data.clientSecret) {
          document.getElementById("card-errors").textContent = "Server error – could not initialize payment.";
          return;
        }

        const { error, paymentIntent } = await stripe.confirmCardPayment(data.clientSecret, { payment_method: { card } });
        if (error) {
          document.getElementById("card-errors").textContent = error.message;
        } else if (paymentIntent.status === "succeeded") {
          alert("Payment successful! Your order has been submitted.");
          form.submit();
        }
      });
    });
  </script>
</body>
</html>
