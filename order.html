<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Order • The Memory House</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Commission your custom portrait with The Memory House.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/assets/fonts/memho-fonts.css?v=1">
</head>
<body class="order">
  <div class="background-sun"></div>
  <div class="site-container">

    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="site-logo">The Memory House</a>
        <nav class="site-nav">
          <a href="/gallery">Gallery</a>
          <a href="/about">About</a>
          <a href="/order" class="active">Order</a>
        </nav>
      </div>
    </header>

    <main class="site-main">
      <section class="order-intro">
        <h1>Order Your Portrait</h1>
        <p>Every Memory House portrait is custom-made to honor your loved one. Complete the form below to begin.</p>
      </section>

      <section class="order-form">
        <form id="payment-form">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>

          <label for="address">Shipping Address</label>
          <textarea id="address" name="address" rows="3" required></textarea>

          <label for="size">Portrait Size</label>
          <select id="size" name="size" required>
            <option value="">Select size…</option>
            <option value="Premium Gift Package">Premium Gift Package (Best Value)</option>
            <option value="18×24">18×24</option>
            <option value="12×18">12×18</option>
            <option value="8×10">8×10</option>
          </select>

          <label for="notes">Special Notes or Requests</label>
          <textarea id="notes" name="notes" rows="4"></textarea>

          <label for="card-element">Credit or Debit Card</label>
          <div id="card-element" style="padding: 12px; border: 1px solid #ccc; border-radius: 6px; background: white; min-height: 56px; margin-bottom: 12px;"></div>
          <div id="card-errors" role="alert" style="color: red; margin-bottom: 20px;"></div>

          <button type="submit">Submit Order</button>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; The Memory House</p>
    </footer>
  </div>

  <!-- Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const stripe = Stripe("pk_test_51Ric5sAyeIzuGSz8nUZmXU1UmEJAcQqomOZhAVo3IpwtjIEz8rDRR2e6nQZPWht4v5B0EAw4wNwDJybTJDu4VdCk00VvmcZm5H");
      const elements = stripe.elements();
      const card = elements.create("card", {
        style: {
          base: {
            fontSize: '16px',
            color: '#333',
            '::placeholder': { color: '#aaa' }
          },
          invalid: {
            color: '#e5424d',
            iconColor: '#e5424d'
          }
        }
      });
      card.mount("#card-element");

      const form = document.getElementById("payment-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const { error, paymentMethod } = await stripe.createPaymentMethod({
          type: "card",
          card: card,
        });

        const errorEl = document.getElementById("card-errors");
        if (error) {
          errorEl.textContent = error.message;
        } else {
          errorEl.textContent = "✅ Card captured (test mode)";
          console.log("✅ Payment method created:", paymentMethod);
          // You could now proceed with sending paymentMethod.id to your backend
        }
      });
    });
  </script>
</body>
</html>
