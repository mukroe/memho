<body>
<!-- Your existing HTML layout and header stays unchanged -->
<!-- Begin form -->
<form id="payment-form" method="POST">
  <label for="name">Your Name:</label>
  <input id="name" name="name" required type="text" />

  <label for="email">Your Email:</label>
  <input id="email" name="email" required type="email" />

  <label for="address">Mailing Address:</label>
  <textarea id="address" name="address" required rows="3"></textarea>

  <label for="size">Portrait Size:</label>
  <select id="size" name="size" required>
    <option value="Premium Gift Package">Premium Gift Package</option>
    <option value="18×24">18×24</option>
    <option value="12×18">12×18</option>
    <option value="8×10">8×10</option>
  </select>

  <label for="notes">Special Notes:</label>
  <textarea id="notes" name="notes" placeholder="e.g., remove tree, include pet"></textarea>

  <div id="card-element" style="min-height:56px;"></div>
  <div id="card-errors" role="alert" style="color:red;"></div>

  <button type="submit">Submit Order</button>
</form>

<!-- Stripe Scripts -->
<script src="https://js.stripe.com/v3/"></script>
<script>
  const stripe = Stripe('pk_live_51Ric5sAyeIzuGSz82jAzY5GAGschIxgwdRuf5vWHpL5sLYv3c5jIlTIOgpjNgkNMIAf40eSJKATw7J2MfknvqD6G00shdDdHnZ');
  const elements = stripe.elements();
  const card = elements.create('card', {
    hidePostalCode: true,
    style: {
      base: {
        fontSize: '16px',
        color: '#32325d',
        '::placeholder': { color: '#aab7c4' }
      },
      invalid: { color: '#fa755a' }
    }
  });
  card.mount('#card-element');

  const priceMap = {
    "Premium Gift Package": 44000,
    "18×24": 39000,
    "12×18": 29000,
    "8×10": 19000
  };

  const form = document.getElementById('payment-form');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const size = document.getElementById('size').value;
    const amount = priceMap[size];

    const res = await fetch('/.netlify/functions/create-payment-intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount })
    });

    const data = await res.json();
    if (!data.clientSecret) {
      document.getElementById('card-errors').textContent = 'Server error – could not initialize payment.';
      return;
    }

    const { error, paymentIntent } = await stripe.confirmCardPayment(data.clientSecret, {
      payment_method: { card }
    });

    if (error) {
      document.getElementById('card-errors').textContent = error.message;
    } else if (paymentIntent.status === 'succeeded') {
      alert('Payment successful! Your order has been submitted.');
      form.submit();
    }
  });
</script>
</body>
